provider: kiwi

credentials:
  kiwi:
    api_key: "${KIWI_API_KEY}"
  # amadeus:
  #   client_id: "${AMADEUS_CLIENT_ID}"
  #   client_secret: "${AMADEUS_CLIENT_SECRET}"

origins:
  - code: BIO
    city: Bilbao
  - code: EAS
    city: San Sebastián
  - code: VIT
    city: Vitoria

destinations:
  - name: Berlin
    airports: [BER]
  - name: London
    airports: [LHR, LGW, STN, LTN]
  - name: Verona
    airports: [VRN]
  - name: Bergamo
    airports: [BGY]
  - name: Milan Linate
    airports: [LIN]
  - name: New York
    airports: [JFK, EWR]

search:
  date_range_days: 90
  currency: EUR
  adults: 1
  flight_type: oneway  # "oneway" or "round" for round-trip
  max_results_per_route: 50
  # Round-trip options (only used when flight_type: round)
  nights_min: 2   # Minimum nights at destination
  nights_max: 7   # Maximum nights at destination
  # Flexible dates: search around specific target dates instead of a full range.
  # Each date is searched +/- date_flex_days. Leave empty to use date_range_days.
  target_dates: []  # e.g. ["2026-06-15", "2026-08-01"]
  date_flex_days: 3

filters:
  prefer_direct: true
  max_stops: 1
  max_duration_minutes: 600
  departure_time_earliest: "06:00"
  departure_time_latest: "22:00"
  allowed_airlines: []
  excluded_airlines: []
  cabin_bag_only: false  # true = only search cabin-bag fares (no checked luggage)

analysis:
  deal_threshold_pct: 25
  min_history_count: 3
  # Only use the last N days of history for price averages.
  # Useful for seasonal routes where old prices distort comparisons.
  # Omit or set to null to use all available history.
  # stats_lookback_days: 90

storage:
  db_path: "~/.flight_monitor/prices.db"

reporting:
  format: console
  html_output_path: "/tmp/flight_deals_report.html"
  # Email delivery (optional). Set enabled: true and configure below.
  # Env vars in disabled sections are safely ignored.
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    sender: ""
    password: "${SMTP_PASSWORD}"
    recipients: []
  # Telegram notifications (optional). Sends deal summaries to a Telegram chat.
  # Create a bot via @BotFather and get the chat_id from @userinfobot.
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
